<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Musa Joshua Timbershade</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; font-family: system-ui, sans-serif; background: #143326; color: #252525; }
    main { max-width: 440px; background: #fff; border-radius: 14px; padding: 1.75rem 1.5rem; }
    h1 { margin-top: 0; color: #143326; font-size: 1.4rem; }
    a { color: #1B4332; font-weight: 600; }
  </style>
</head>
<body>
  <!--
    This page is only served by static hosting (GitHub Pages), which cannot run
    the PHP dashboard. On the PHP host, admin/.htaccess serves index.php instead.
    Once the PHP site is live, set siteUrl in assets/js/config.js and this page
    forwards to the real login.
  -->
  <main>
    <h1>Admin dashboard</h1>
    <p id="msg">The admin dashboard runs on the business's PHP hosting, not on this GitHub Pages copy of the site. It is not live yet.</p>
    <p><a href="../index.html">&larr; Back to the website</a></p>
  </main>
  <script src="../assets/js/config.js"></script>
  <script>
    (function () {
      var url = window.MJT && MJT.config && MJT.config.siteUrl;
      if (!url) return;
      var target = String(url).replace(/\/+$/, '') + '/admin/';
      document.getElementById('msg').textContent = 'The dashboard has moved. Taking you to the login page…';
      window.location.replace(target);
    })();
  </script>
</body>
</html>
